databases:
  - name: blog_db
    plan: free
    databaseName: blog_db
    user: blog_db_user

services:
  - type: web
    plan: free
    name: blog
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn django_project.asgi:application -k uvicorn.workers.UvicornWorker' 
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blog_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4